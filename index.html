<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons generated from public/jaidee-chiangmai-logo.png (the emblem, without the wordmark). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Kept in step with the resolved theme by src/lib/theme.ts. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Verified needs in Chiang Mai, matched with people who want to help" />
    <meta property="og:title" content="Jaidee Chiang Mai · แผนที่ช่วยกัน" />
    <meta property="og:description" content="Verified needs in Chiang Mai, matched with people who want to help" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Jaidee · แผนที่ช่วยกัน</title>
    <!--
      Resolve the saved theme before the first paint, so a chosen light page never flashes dark
      (and the reverse). Mirrors src/lib/theme.ts; the key holds JSON, as useLocalStorage writes it.
    -->
    <script>
      ;(function () {
        var resolved = 'light'
        try {
          var pref = JSON.parse(localStorage.getItem('jaidee.theme') || '"system"')
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          resolved = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode or bad value: fall back to light */
        }
        document.documentElement.dataset.theme = resolved
        var bar = document.querySelector('meta[name="theme-color"]')
        if (bar) bar.setAttribute('content', resolved === 'dark' ? '#161617' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
